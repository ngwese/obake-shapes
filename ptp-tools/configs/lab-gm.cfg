# Scratch-LAN lab grandmaster for local experiments ONLY.
# Do NOT run this on a studio AES67/RAVENNA PTP network.
# Pass the interface on the command line: ptp4l -f ... -i eth0 -m
[global]
clientOnly			0
priority1			128
priority2			128
domainNumber			0
network_transport		UDPv4
delay_mechanism			E2E
time_stamping			hardware
dscp_event			46
dscp_general			34
logAnnounceInterval		0
logSyncInterval			-3
logMinDelayReqInterval		-3
announceReceiptTimeout		3
